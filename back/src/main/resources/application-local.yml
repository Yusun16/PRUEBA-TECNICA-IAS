reconciliation:
  # Fictional single-capture data from the exercise; never a production default.
  allow-duplicate-compensation: true
spring:
  datasource:
    url: jdbc:h2:mem:pagoclaro;MODE=Oracle;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=5000
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/local/schema.sql
      data-locations: classpath:db/local/data.sql
  security:
    user:
      password: ${SUPPORT_PASSWORD:demo-change-me}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
