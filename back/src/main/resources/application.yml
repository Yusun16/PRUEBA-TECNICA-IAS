spring:
  application:
    name: support-reconciliation
  profiles:
    default: local
  datasource:
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 8
  security:
    user:
      name: ${SUPPORT_USER:n3}
      roles: SUPPORT
reconciliation:
  allow-duplicate-compensation: ${RECONCILIATION_ALLOW_DUPLICATE_COMPENSATION:false}
logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: INFO
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: INFO
    org.springframework.security: INFO
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    persist-authorization: false
    supported-submit-methods: [get, post]
  paths-to-match: /api/support/**
  override-with-generic-response: false
