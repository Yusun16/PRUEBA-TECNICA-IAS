spring:
  application:
    name: support-reconciliation
  profiles:
    default: local
  datasource:
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 8
  security:
    user:
      name: ${SUPPORT_USER:n3}
      roles: SUPPORT
reconciliation:
  allow-duplicate-compensation: ${RECONCILIATION_ALLOW_DUPLICATE_COMPENSATION:false}
logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: INFO
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: INFO
    org.springframework.security: INFO
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
